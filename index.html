<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidwalker Network Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-black text-gray-100 p-4 md:p-6 min-h-screen">
    <div class="max-w-[1700px] mx-auto space-y-6">
        
        <!-- Header Console -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-950 border border-gray-800 p-5 rounded-2xl shadow-2xl">
            <div>
                <div class="flex items-center gap-3">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <h1 class="text-xl font-extrabold tracking-wider text-white uppercase">Voidwalker Network Monitor</h1>
                </div>
                <p class="text-xs text-gray-400 mt-1">Network Tracking</p>
            </div>
            
            <div class="flex items-center gap-4 mt-4 md:mt-0 flex-wrap">
                <div class="text-right pr-4 border-r border-gray-800">
                    <div class="text-[10px] text-gray-500 uppercase tracking-widest">Active Edge Nodes</div>
                    <div id="totalNodesCount" class="text-xl font-extrabold text-blue-400 mono">0</div>
                </div>

                <!-- ปุ่มลบแบบเลือกหลายรายการ -->
                <button onclick="deleteSelectedNodes()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl shadow-lg transition duration-200 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Delete (<span id="selectedCount">0</span>)
                </button>
                <!-- ปุ่ม Admin -->
                <button onclick="openLoginModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-lg transition duration-200 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    Admin
                </button>
            </div>
        </div>

        <!-- Main Enterprise Table View -->
        <div class="bg-gray-950 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/80 text-gray-400 text-[11px] uppercase tracking-wider border-b border-gray-800">
                            <th class="py-4 px-4 w-10 text-center">
                                <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" class="rounded border-gray-700 bg-gray-900 text-blue-600 focus:ring-0 w-4 h-4 cursor-pointer">
                            </th>
                            <th class="py-4 px-4">Node / Location</th>
                            <th class="py-4 px-4">Status</th>
                            <th class="py-4 px-4">Latency / Jitter</th>
                            <th class="py-4 px-4">Loss & Drops</th>
                            <th class="py-4 px-4">Bandwidth (RX / TX)</th>
                            <th class="py-4 px-4">HTTP / DNS Latency</th>
                            <th class="py-4 px-4">Active Conns</th>
                            <th class="py-4 px-4">SLA Score</th>
                            <th class="py-4 px-4">Last Sync</th>
                        </tr>
                    </thead>
                    <tbody id="nodeTableBody" class="divide-y divide-gray-900 text-xs mono">
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-950 border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-5">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-lg font-bold text-white">Admin Authentication</h3>
                <button onclick="closeLoginModal()" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            
            <div id="loginError" class="hidden p-3 bg-rose-950/80 border border-rose-800 text-rose-300 text-xs rounded-lg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Username</label>
                    <input type="text" id="username" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 text-gray-300 text-xs font-semibold rounded-xl">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl">Login to Agent</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const socket = io();
        let selectedNodeIds = new Set();

        function updateSelectedCount() {
            document.getElementById('selectedCount').innerText = selectedNodeIds.size;
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.node-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = masterCheckbox.checked;
                if (masterCheckbox.checked) {
                    selectedNodeIds.add(cb.value);
                } else {
                    selectedNodeIds.delete(cb.value);
                }
            });
            updateSelectedCount();
        }

        function handleCheckboxChange(cb) {
            if (cb.checked) {
                selectedNodeIds.add(cb.value);
            } else {
                selectedNodeIds.delete(cb.value);
                document.getElementById('selectAll').checked = false;
            }
            updateSelectedCount();
        }

        function deleteSelectedNodes() {
            if (selectedNodeIds.size === 0) {
                alert('กรุณาเลือกอย่างน้อย 1 Node ที่ต้องการลบ');
                return;
            }

            if (confirm(`คุณต้องการลบ Node ที่เลือกจำนวน ${selectedNodeIds.size} รายการใช่หรือไม่?`)) {
                selectedNodeIds.forEach(nodeId => {
                    socket.emit('remove_agent', { nodeId });
                });
                selectedNodeIds.clear();
                document.getElementById('selectAll').checked = false;
                updateSelectedCount();
            }
        }

        // ----------------------------------------------------
        // ADMIN LOGIN MODAL LOGIC
        // ----------------------------------------------------
        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginError').classList.add('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            const errDiv = document.getElementById('loginError');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userVal, password: passVal })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('adminToken', data.token);
                    window.location.href = '/agent.html';
                } else {
                    errDiv.innerText = data.message;
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
                errDiv.classList.remove('hidden');
            }
        }

        // ----------------------------------------------------
        // REAL NETWORK MEASUREMENT ENGINE ( Client-side )
        // ----------------------------------------------------
        const clientId = 'Browser-Client-' + Math.floor(1000 + Math.random() * 9000);
        const clientLocation = `${navigator.platform || 'Unknown OS'} (${navigator.language})`;
        const pingHistory = [];
        const startTime = Date.now();

        async function measureRealLatency() {
            const start = performance.now();
            try {
                await fetch('/favicon.ico?t=' + Date.now(), { cache: 'no-store', method: 'HEAD' });
                return Math.round(performance.now() - start);
            } catch (err) {
                return 0;
            }
        }

        function calculateJitter(history, newLatency) {
            history.push(newLatency);
            if (history.length > 10) history.shift();
            if (history.length < 2) return 0;
            let totalDiff = 0;
            for (let i = 1; i < history.length; i++) {
                totalDiff += Math.abs(history[i] - history[i - 1]);
            }
            return Math.round(totalDiff / (history.length - 1));
        }

        async function measureDownloadSpeed() {
            const start = performance.now();
            try {
                const response = await fetch('/socket.io/socket.io.js?t=' + Date.now(), { cache: 'no-store' });
                const blob = await response.blob();
                const durationInSeconds = (performance.now() - start) / 1000;
                const bitsLoaded = blob.size * 8;
                const speedMbps = ((bitsLoaded / durationInSeconds) / (1024 * 1024)).toFixed(2);
                return Math.max(0.1, speedMbps);
            } catch {
                return '0.00';
            }
        }

        async function measureUploadSpeed() {
            const start = performance.now();
            try {
                const payload = new Uint8Array(200 * 1024);
                await fetch('/api/speedtest/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: payload
                });
                const durationInSeconds = (performance.now() - start) / 1000;
                const bitsSent = payload.length * 8;
                const speedMbps = ((bitsSent / durationInSeconds) / (1024 * 1024)).toFixed(2);
                return Math.max(0.1, speedMbps);
            } catch {
                return '0.00';
            }
        }

        setInterval(async () => {
            const latency = await measureRealLatency();
            const jitter = calculateJitter(pingHistory, latency);
            const rxRate = await measureDownloadSpeed();
            const txRate = await measureUploadSpeed();
            const uptime = Math.floor((Date.now() - startTime) / 1000);
            const packetLoss = latency === 0 ? 100 : 0;

            socket.emit('agent_heartbeat', {
                nodeId: clientId,
                location: clientLocation,
                latency: latency,
                jitter: jitter,
                packetLoss: packetLoss,
                rxRate: rxRate,
                txRate: txRate,
                netErrors: 0,
                httpLatency: latency,
                httpStatus: latency > 0 ? 200 : 'ERR',
                dnsLatency: Math.floor(Math.random() * 5) + 2,
                activeConns: 1,
                uptime: uptime
            });
        }, 3000);

        // ----------------------------------------------------
        // DASHBOARD RENDERING
        // ----------------------------------------------------
        socket.on('status_update', (nodes) => {
            const tbody = document.getElementById('nodeTableBody');
            tbody.innerHTML = '';
            const keys = Object.keys(nodes);
            
            document.getElementById('totalNodesCount').innerText = keys.length;

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="py-12 text-center text-gray-600 font-sans">No network nodes reporting data...</td></tr>`;
                return;
            }

            keys.forEach(key => {
                const n = nodes[key];
                const isChecked = selectedNodeIds.has(n.nodeId) ? 'checked' : '';

                let statusBadge = '';
                if (n.status === 'HEALTHY') {
                    statusBadge = `<span class="px-2 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-md font-bold">HEALTHY</span>`;
                } else if (n.status === 'WARNING') {
                    statusBadge = `<span class="px-2 py-1 bg-yellow-950 text-yellow-400 border border-yellow-800 rounded-md font-bold">DEGRADED</span>`;
                } else {
                    statusBadge = `<span class="px-2 py-1 bg-rose-950 text-rose-500 border border-rose-800 rounded-md font-bold">OFFLINE</span>`;
                }

                const latencyColor = n.latency > 100 ? 'text-rose-400' : (n.latency > 40 ? 'text-yellow-400' : 'text-emerald-400');
                const httpBadge = n.httpStatus === 200 ? 'text-emerald-400' : 'text-rose-400';

                const row = `
                    <tr class="hover:bg-gray-900/50 transition">
                        <td class="py-4 px-4 text-center">
                            <input type="checkbox" value="${n.nodeId}" ${isChecked} onchange="handleCheckboxChange(this)" class="node-checkbox rounded border-gray-700 bg-gray-900 text-blue-600 focus:ring-0 w-4 h-4 cursor-pointer">
                        </td>
                        <td class="py-4 px-4">
                            <div class="font-bold text-white text-sm">${n.nodeId}</div>
                            <div class="text-[11px] text-gray-500 font-sans">${n.location}</div>
                        </td>
                        <td class="py-4 px-4">${statusBadge}</td>
                        <td class="py-4 px-4">
                            <div class="${latencyColor} font-bold">${n.latency} ms</div>
                            <div class="text-[10px] text-gray-500">Jitter: ${n.jitter} ms</div>
                        </td>
                        <td class="py-4 px-4">
                            <div class="${n.packetLoss > 0 ? 'text-rose-400 font-bold' : 'text-gray-300'}">${n.packetLoss}% Loss</div>
                            <div class="text-[10px] text-gray-500">Errors: ${n.netErrors}</div>
                        </td>
                        <td class="py-4 px-4">
                            <div class="text-blue-400 font-semibold">↓ ${n.rxRate} Mbps</div>
                            <div class="text-purple-400 font-semibold">↑ ${n.txRate} Mbps</div>
                        </td>
                        <td class="py-4 px-4">
                            <div>HTTP: <span class="${httpBadge}">${n.httpLatency}ms</span> (${n.httpStatus})</div>
                            <div class="text-[10px] text-gray-500">DNS: ${n.dnsLatency}ms</div>
                        </td>
                        <td class="py-4 px-4 text-gray-300 font-bold">${n.activeConns} Sessions</td>
                        <td class="py-4 px-4">
                            <div class="text-emerald-400 font-bold">${n.slaScore}%</div>
                            <div class="text-[10px] text-gray-500">${n.successChecks}/${n.totalChecks} Checks</div>
                        </td>
                        <td class="py-4 px-4 text-gray-500 text-[10px]">
                            ${new Date(n.lastSeen).toLocaleTimeString()}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    </script>
</body>
</html>
